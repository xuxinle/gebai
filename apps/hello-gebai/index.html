<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>你好，歌白 · 托管应用</title>
<style>
  :root{color-scheme:light dark}
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f1115;color:#e8e8ed}
  .card{width:min(560px,92vw);background:#171a21;border:1px solid #262b36;border-radius:16px;padding:28px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:#8b93a3;font-size:13px;margin:0 0 20px}
  button, input{font:inherit}
  .row{display:flex;gap:8px;margin-bottom:14px}
  input{flex:1;background:#0f1115;border:1px solid #2c323e;border-radius:10px;padding:9px 12px;color:inherit}
  button{background:#3b82f6;border:0;border-radius:10px;padding:9px 16px;color:#fff;cursor:pointer}
  button:hover{background:#2f6fd8}
  pre{margin:0;background:#0f1115;border:1px solid #2c323e;border-radius:10px;padding:14px;font-size:12.5px;color:#9ae6b4;overflow:auto;max-height:240px}
  .meta{color:#6b7486;font-size:12px;margin-top:14px;line-height:1.7}
  code{background:#222834;padding:1px 6px;border-radius:5px}
</style>
</head>
<body>
<div class="card">
  <h1>你好，歌白</h1>
  <p class="sub">这是一个托管应用：静态页面由 <code>/apps/hello-gebai/</code> 提供，后端由 <code>/api/apps/hello-gebai/*</code> 提供。</p>
  <div class="row">
    <input id="name" placeholder="输入名字" value="世界">
    <button id="go">调用后端</button>
  </div>
  <pre id="out">（点一下按钮）</pre>
  <div class="meta">
    进程：页面与后端同源同端口。改这个目录下的文件后刷新即可生效，不必重启服务。
  </div>
</div>
<script>
  const out = document.getElementById("out")
  async function call(path, body) {
    out.textContent = "请求中…"
    try {
      const res = await fetch("/api/apps/hello-gebai" + path, body === undefined ? {} : {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      })
      const text = await res.text()
      let data
      try { data = JSON.parse(text) } catch { data = text }
      out.textContent = `${res.status} ${res.statusText}\n\n` + (typeof data === "string" ? data : JSON.stringify(data, null, 2))
    } catch (err) {
      out.textContent = "请求失败：" + err
    }
  }
  document.getElementById("go").onclick = () => call("/greet", { name: document.getElementById("name").value })
  // 打开页面即探一次后端健康：后端没启用时这里会如实显示原因
  call("/health")
</script>
</body>
</html>
