<!doctype html>
<html lang="zh-CN" data-theme="acrylic">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>文件工作台 · 歌白</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%0A%20%20%3Crect%20x%3D%222%22%20y%3D%222%22%20width%3D%2228%22%20height%3D%2228%22%20rx%3D%227%22%20fill%3D%22%234D6BFE%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M9%2010h14M9%2016h14M9%2022h9%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222.4%22%20stroke-linecap%3D%22round%22%2F%3E%0A%3C%2Fsvg%3E" />
    <style id="gb-splash-style">
      /* 启动遮罩：列表/编辑器就绪前挡住未渲染的骨架（与主界面 splash 同风格，避免闪白） */
      #gb-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: var(--bg, #0c0c0e);
        transition: opacity 0.3s ease;
      }
      #gb-splash.gb-splash-done { opacity: 0; pointer-events: none; }
      .gb-splash-inner { display: flex; flex-direction: column; align-items: center; gap: 14px; }
      .gb-splash-orb {
        width: 64px; height: 64px; border-radius: 50%;
        background: linear-gradient(135deg, #06b6d4, #8b5cf6, #ec4899);
        box-shadow: 0 0 48px rgba(139, 92, 246, 0.4);
        animation: gb-splash-breathe 1.5s ease-in-out infinite alternate;
      }
      @keyframes gb-splash-breathe { from { transform: scale(0.94); opacity: 0.85 } to { transform: scale(1.04); opacity: 1 } }
      .gb-splash-text { font: 13px/1.6 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--text-muted, #8b949e); letter-spacing: .12em }
    </style>
  </head>
  <body class="fw-page">
    <div id="gb-splash">
      <div class="gb-splash-inner">
        <div class="gb-splash-orb"></div>
        <div class="gb-splash-text">文件工作台</div>
      </div>
    </div>
    <script type="module" src="/src/files/main.ts"></script>
  </body>
</html>
