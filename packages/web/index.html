<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>歌白</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%0D%0A%20%20%3Crect%20x%3D%222%22%20y%3D%222%22%20width%3D%2228%22%20height%3D%2228%22%20rx%3D%227%22%20fill%3D%22%234D6BFE%22%2F%3E%0D%0A%20%20%3Cg%20fill%3D%22%23fff%22%3E%0D%0A%20%20%20%20%3Cpath%20d%3D%22M16%207.2%20C12.4%206.9%209.6%208.9%209.1%2011.6%20C7.4%2012.1%206.4%2013.7%206.7%2015.4%20C6.0%2016.7%206.5%2018.4%207.8%2019.2%20C8.0%2021.0%209.6%2022.4%2011.4%2022.4%20C12.0%2023.4%2013.2%2024.0%2014.4%2023.8%20L16%2023.6%20Z%22%2F%3E%0D%0A%20%20%20%20%3Cpath%20d%3D%22M16%207.2%20C19.6%206.9%2022.4%208.9%2022.9%2011.6%20C24.6%2012.1%2025.6%2013.7%2025.3%2015.4%20C26.0%2016.7%2025.5%2018.4%2024.2%2019.2%20C24.0%2021.0%2022.4%2022.4%2020.6%2022.4%20C20.0%2023.4%2018.8%2024.0%2017.6%2023.8%20L16%2023.6%20Z%22%2F%3E%0D%0A%20%20%3C%2Fg%3E%0D%0A%20%20%3Cg%20fill%3D%22none%22%20stroke%3D%22%234D6BFE%22%20stroke-width%3D%221.1%22%20stroke-linecap%3D%22round%22%3E%0D%0A%20%20%20%20%3Cpath%20d%3D%22M13.6%209.0%20C13.1%2010.2%2013.7%2011.2%2014.9%2011.5%22%2F%3E%0D%0A%20%20%20%20%3Cpath%20d%3D%22M10.9%2011.9%20C12.3%2012.4%2013.0%2013.5%2012.8%2014.8%22%2F%3E%0D%0A%20%20%20%20%3Cpath%20d%3D%22M8.6%2015.8%20C10.0%2015.9%2011.0%2016.8%2011.2%2018.1%22%2F%3E%0D%0A%20%20%20%20%3Cpath%20d%3D%22M10.3%2019.6%20C11.4%2019.4%2012.4%2019.9%2012.9%2020.8%22%2F%3E%0D%0A%20%20%20%20%3Cpath%20d%3D%22M13.8%2015.0%20C13.3%2016.1%2013.7%2017.2%2014.8%2017.7%22%2F%3E%0D%0A%20%20%20%20%3Cpath%20d%3D%22M14.7%2020.4%20C13.9%2021.2%2013.9%2022.3%2014.6%2023.1%22%2F%3E%0D%0A%20%20%20%20%3Cpath%20d%3D%22M18.4%209.0%20C18.9%2010.2%2018.3%2011.2%2017.1%2011.5%22%2F%3E%0D%0A%20%20%20%20%3Cpath%20d%3D%22M21.1%2011.9%20C19.7%2012.4%2019.0%2013.5%2019.2%2014.8%22%2F%3E%0D%0A%20%20%20%20%3Cpath%20d%3D%22M23.4%2015.8%20C22.0%2015.9%2021.0%2016.8%2020.8%2018.1%22%2F%3E%0D%0A%20%20%20%20%3Cpath%20d%3D%22M21.7%2019.6%20C20.6%2019.4%2019.6%2019.9%2019.1%2020.8%22%2F%3E%0D%0A%20%20%20%20%3Cpath%20d%3D%22M18.2%2015.0%20C18.7%2016.1%2018.3%2017.2%2017.2%2017.7%22%2F%3E%0D%0A%20%20%20%20%3Cpath%20d%3D%22M17.3%2020.4%20C18.1%2021.2%2018.1%2022.3%2017.4%2023.1%22%2F%3E%0D%0A%20%20%3C%2Fg%3E%0D%0A%3C%2Fsvg%3E"/>
    <style id="gb-splash-style">
      /* 启动动画画面：样式内联于 HTML，页面加载（外部 CSS/JS 就绪前）立即生效，
         底色与默认形态一致——默认主题 acrylic 亮色（白）为主，避免主题 CSS 就绪前闪出暗色窗口 */
      #gb-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background:
          radial-gradient(ellipse 900px 480px at 50% -10%, rgba(85, 102, 238, 0.10), transparent 60%),
          radial-gradient(ellipse 700px 420px at 85% 110%, rgba(31, 157, 95, 0.08), transparent 55%),
          radial-gradient(ellipse 600px 360px at 12% 110%, rgba(85, 102, 238, 0.06), transparent 55%),
          #f2f2f6;
        transition: opacity 0.35s ease;
      }
      #gb-splash.gb-splash-done { opacity: 0; pointer-events: none; }
      .gb-splash-inner { display: flex; flex-direction: column; align-items: center; }
      .gb-splash-orb {
        position: relative; width: 84px; height: 84px; border-radius: 50%;
        background: linear-gradient(135deg, #06b6d4, #8b5cf6, #ec4899);
        box-shadow: 0 0 60px rgba(139, 92, 246, 0.35), 0 0 120px rgba(6, 182, 212, 0.2);
        animation: gb-splash-breathe 1.6s ease-in-out infinite alternate;
      }
      @keyframes gb-splash-breathe {
        from { transform: scale(0.92); filter: blur(1px) saturate(1.1); }
        to   { transform: scale(1.08); filter: blur(2px) saturate(1.35); }
      }
      .gb-splash-ring {
        position: absolute; inset: -10px; border-radius: 50%;
        background: conic-gradient(from 0deg, transparent 0 70%, rgba(85, 102, 238, 0.75) 84%, transparent 94%);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1px));
        animation: gb-splash-spin 1.4s linear infinite;
      }
      @keyframes gb-splash-spin { to { transform: rotate(360deg); } }
      .gb-splash-brand {
        margin-top: 30px; font-size: 24px; font-weight: 600; letter-spacing: 8px; text-indent: 8px;
        color: #141418; animation: gb-splash-glow 2.2s ease-in-out infinite alternate;
      }
      @keyframes gb-splash-glow {
        from { opacity: 0.7; }
        to   { opacity: 1; text-shadow: 0 0 20px rgba(85, 102, 238, 0.45); }
      }
    </style>
  </head>
  <body>
    <!-- 启动动画画面（JS 就绪前覆盖全屏；init 完成/失败或 12s 超时后自动移除） -->
    <div id="gb-splash" aria-hidden="true">
      <div class="gb-splash-inner">
        <div class="gb-splash-orb" aria-hidden="true"><span class="gb-splash-ring"></span></div>
        <div class="gb-splash-brand">歌白</div>
      </div>
    </div>
    <script>
      // 兜底：JS 模块加载/初始化异常时最多展示 12s，避免启动画面永久残留
      setTimeout(function () {
        var s = document.getElementById("gb-splash")
        if (s) { s.classList.add("gb-splash-done"); setTimeout(function () { s.remove() }, 400) }
      }, 12000)
    </script>
    <div id="app">
      <header>
        <button id="sidebar-toggle" class="icon-btn" data-tip="会话列表" aria-label="切换会话列表"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
        <span id="header-title" class="header-title"></span>
        <div class="header-right">
          <!-- 单轮计时器：运行中实时走，结束定格保留，下次运行重启；按时长分级变色，hover 显示累计总运行时（外观 tab 可关） -->
          <div id="turn-timer" class="turn-timer" hidden aria-hidden="true">
            <svg class="tt-ico" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 22h14"/><path d="M5 2h14"/><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"/><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"/></svg>
            <span class="tt-text"></span>
          </div>
          <div id="header-ctx" hidden>
            <svg class="ctx-ring" viewBox="0 0 24 24" aria-hidden="true">
              <circle class="ctx-track" cx="12" cy="12" r="9" pathLength="100"></circle>
              <circle class="ctx-fill" cx="12" cy="12" r="9" pathLength="100"></circle>
              <!-- 信号灯圆点：与圆环同一 SVG 坐标系，任何 DPI 下严格同心 -->
              <circle class="conn-dot" cx="12" cy="12" r="3"></circle>
            </svg>
            <div id="conn" class="conn"></div>
          </div>
          <button id="wheel-btn" class="icon-btn" aria-label="快捷操作" aria-expanded="false"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg></button>
        </div>
      </header>
      <aside id="sessions">
        <div class="session-top">
          <div class="session-search-wrap">
            <svg class="session-search-ico" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input id="session-search" type="text" autocomplete="off" spellcheck="false" placeholder="搜索会话" />
          </div>
          <button id="new-session" data-tip="新会话">＋</button>
        </div>
        <div id="batch-bar" class="batch-bar" hidden>
          <span id="batch-count">已选 0 项</span>
          <button id="batch-del" class="batch-del" disabled>删除所选</button>
          <button id="batch-cancel" class="batch-cancel">取消</button>
        </div>
        <ul id="session-list"></ul>
        <!-- 轮盘按钮源容器：8 个低频操作按钮由 wheel.ts 移入标题栏轮盘（main.ts 顶层有元素绑定，须保持元素存在） -->
        <div id="wheel-source" hidden>
          <button id="mini-tools-btn" class="icon-btn" data-tip="小工具" aria-label="HTML 小工具"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg></button>
          <button id="export-btn" class="icon-btn" data-tip="导出会话" aria-label="导出会话"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg></button>
          <button id="compact-btn" class="icon-btn" data-tip="压缩上下文" aria-label="压缩上下文"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4"/></svg></button>
          <button id="approval-skip" class="icon-btn" data-tip="自动审批" aria-label="切换自动审批"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M13 2L4.5 13H11l-1 9 8.5-11H12l1-9z"/></svg></button>
          <button id="minimal-mode" class="icon-btn" data-tip="极简模式" aria-label="切换极简模式"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M7 12h10"/><path d="M10 17h4"/></svg></button>
          <button id="theme-btn" class="icon-btn" data-tip="主题" aria-label="切换 UI 风格" aria-expanded="false"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.19-4.03-8-9-8zm-5.5 9C5.67 12 5 11.33 5 10.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5 11 5.67 11 6.5 10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5 16 5.67 16 6.5 15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9 19 9.67 19 10.5 18.33 12 17.5 12z"/></svg></button>
          <button id="settings-btn" class="icon-btn" data-tip="设置" aria-label="打开设置"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94L14.4 2.81c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41L9.25 5.35C8.66 5.59 8.12 5.92 7.63 6.29L5.24 5.33c-.22-.08-.47 0-.59.22L2.74 8.87C2.62 9.08 2.66 9.34 2.86 9.48l2.03 1.58c-.04.3-.07.63-.07.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61L19.14 12.94zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></button>
          <button id="logout-btn" class="icon-btn" data-tip="登出" aria-label="登出" hidden><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg></button>
        </div>
      </aside>
      <main>
        <div class="chat-wrap">
          <div id="messages"></div>
          <nav id="msg-nav" class="msg-nav" hidden aria-label="会话内消息导航"></nav>
          <button id="jump-bottom" class="jump-bottom" type="button" hidden aria-label="跳到最新消息" data-tip="跳到最新消息">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>
        </div>
        <div id="approvals"></div>
        <div id="queue" class="queue" hidden></div>
        <form id="composer">
          <input type="file" id="file-input" multiple hidden />
          <div id="attachments" class="attachments" hidden></div>
          <div class="composer-row">
            <button type="button" id="attach-btn" data-tip="添加附件"><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M16.5 6v11.5a4 4 0 0 1-8 0V5a2.5 2.5 0 0 1 5 0v10.5a1 1 0 0 1-2 0V6H10v9.5a2.5 2.5 0 0 0 5 0V5a4 4 0 0 0-8 0v12.5a5.5 5.5 0 0 0 11 0V6h-1.5z" fill="currentColor"/></svg></button>
            <textarea id="input" rows="1" placeholder="输入你的问题或题目，可直接粘贴图片…"></textarea>
            <button type="submit" id="send" data-tip="发送">
              <svg class="ic-send" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
              <svg class="ic-stop" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="6" y="6" width="12" height="12" fill="currentColor"/></svg>
            </button>
          </div>
        </form>
      </main>
      <div id="theme-pop" class="theme-pop" hidden></div>
    </div>
    <!-- 登录/注册层（服务模式） -->
    <div id="login-overlay" class="login-overlay" hidden>
      <form id="login-form" class="login-card" novalidate>
        <div class="login-brand">歌白</div>
        <div class="login-sub">歌白智能体</div>
        <input id="login-user" type="text" placeholder="用户名" autocomplete="username" />
        <input id="login-pass" type="password" placeholder="密码" autocomplete="current-password" />
        <input id="login-pass2" type="password" placeholder="确认密码" autocomplete="new-password" hidden />
        <button type="submit" class="login-submit">登 录</button>
        <button type="button" id="login-toggle" class="login-toggle">注册账号</button>
        <div id="login-err" class="login-err" hidden></div>
      </form>
    </div>
    <!-- 设置抽屉 -->
    <div id="settings-overlay" class="settings-overlay" hidden>
      <div class="settings-panel">
        <div class="settings-head">
          <span class="settings-title">设置</span>
          <button id="settings-close" class="icon-btn" aria-label="关闭设置">✕</button>
        </div>
        <div class="settings-tabs" id="settings-tabs">
          <button data-tab="env" class="active">环境变量</button>
          <button data-tab="appearance">外观</button>
          <button data-tab="users" hidden>用户</button>
          <button data-tab="feedback" hidden>反馈</button>
        </div>
        <div class="settings-body" id="settings-body"></div>
        <div class="settings-foot" id="settings-foot" hidden></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
