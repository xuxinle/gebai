<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- xiangqi —— 相期（桌面常驻面板）。卡片底 + 人像（头 + 肩）。
       "有个人在等你"是它的语义，比原来的 bell（铃铛=通知）更准：
       它不只是提醒，是**待办/等待用户介入**。

       家族语言（与 gbcode 的 `< >` 同源）：圆角方底 + 白色单色前景、纯填充无描边。
       几何约定见 tools/make_brand_svgs.py 的文件头。 -->
