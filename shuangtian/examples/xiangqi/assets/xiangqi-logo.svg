<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- xiangqi —— 相期（桌面常驻面板）。

       ⚠ 本文件必须与**窗口/任务栏图标**同源：标题栏画这张 SVG，而任务栏/Alt-Tab 用的是
       `examples/xiangqi/main.cpp` 里 `make_xiangqi_icon_png()` 现画的位图。
       两者画不同图形时，同一个应用在两处显示两个图标（用户实测报过
       「标题栏图标要和任务栏图标一致」）。

       所以这里按 `make_xiangqi_icon_png` 的**小尺寸档**几何重画（标题栏 16~20px，
       与位图 `size <= 24` 那一档同形）：
       玄底圆角方（径向 #24201C → #14110E）+ 三段竖条（红 #F26455 / 白 / 蓝 #5AA4E8）。
       大尺寸位图画的是篆书「卿」——矢量这份只在标题栏用，取小尺寸档才与任务栏一致；
       要改图形请**同时**改两处（本文件与 make_xiangqi_icon_png）。

       几何约定见 tools/make_brand_svgs.py 的文件头。 -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#24201C"/>
      <stop offset="100%" stop-color="#14110E"/>
    </radialGradient>
  </defs>

  <!-- 玄底圆角方：半径 0.22 边长（位图 sd_round_rect 用 0.24，同为“方形网格里占位更满”那一档） -->
  <rect x="0.5" y="0.5" width="23" height="23" rx="5.2" fill="url(#bg)"/>
  <!-- 外缘极细亮边（#565049）：深底在深色任务栏上会糊成一团，这圈边是分离度来源 -->
  <rect x="0.8" y="0.8" width="22.4" height="22.4" rx="5.0" fill="none"
        stroke="#565049" stroke-opacity="0.55" stroke-width="0.7"/>

  <!-- 三段竖条：左红 / 中白 / 右蓝。
       位置取自位图：cx 0.265 / 0.500 / 0.735，半宽 0.058 / 0.064 / 0.058，
       纵向 0.230..0.770；两侧微外凸（位图用 sin 轻微弧度让三条不像死板色条）。 -->
  <path fill="#F26455" d="M6.36 5.52 L5.92 12.0 L6.36 18.48 H7.80 L7.24 12.0 L7.80 5.52 Z"/>
  <path fill="#FFFFFF" d="M10.71 5.52 L10.35 12.0 L10.71 18.48 H13.29 L12.93 12.0 L13.29 5.52 Z"/>
  <path fill="#5AA4E8" d="M16.20 5.52 L15.76 12.0 L16.20 18.48 H17.64 L18.20 12.0 L17.64 5.52 Z"/>
</svg>
