  <!-- xmlapp —— 纯 XML+JS 示例。尖括号 + 中间一道斜杠（`</>` 的记号）。
       与 gbcode 的 `< >` 区分：那里中点圆（光标），这里斜杠（闭合标签）。
       同族不同物——放在任务栏相邻位置能看出是同一家族、但不是一个应用。

       家族语言（与 gbcode 的 `< >` 同源）：圆角方底 + 白色单色前景、纯填充无描边。
       几何约定见 tools/make_brand_svgs.py 的文件头。 -->
