<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- jianmu —— 建木（三维建模与演示）。等轴测立方体 + 顶上长出的树。
       立方体说"三维"，树说"建木"（纯几何体太像任意 3D 软件）。
       树干从顶面中心起笔、往下压进顶面——不压进去会读成"浮在方块上方"；
       顶面明度必须与树干拉开（0.66 / 左0.40 / 右0.24）：初版顶面 0.88 时
       纯白树干与纯白顶面连成一片，树干几乎看不见。
       坐标与 tools/make_icons.py 的 icon_jianmu 同源：256 画布按 21/255 映射进
       1.5..22.5 的家族底，两边改一边必改另一边。

       家族语言（与 gbcode 的 `< >` 同源）：圆角方底 + 白色单色前景、纯填充无描边。
       几何约定见 tools/make_brand_svgs.py 的文件头。 -->
  <path fill="#2F6E52" d="M6.75 0.5 L17.25 0.5 C20.15 0.5 22.5 2.85 22.5 5.75 L22.5 16.25
    C22.5 19.15 20.15 21.5 17.25 21.5 L6.75 21.5 C3.85 21.5 1.5 19.15 1.5 16.25
    L1.5 5.75 C1.5 2.85 3.85 0.5 6.75 0.5 Z"/>
  <g fill="#FFFFFF">
    <path d="M12 10.359 L16.547 12.984 L12 15.609 L7.454 12.984 Z" opacity="0.66"/>
    <path d="M12 15.609 L12 20.859 L7.454 18.234 L7.454 12.984 Z" opacity="0.40"/>
    <path d="M12 15.609 L12 20.859 L16.547 18.234 L16.547 12.984 Z" opacity="0.24"/>
    <g stroke="#FFFFFF" stroke-linecap="round">
