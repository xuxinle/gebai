<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- xiangqi —— 相期（桌面常驻面板）。

       ⚠ 本文件必须与**窗口/任务栏图标**同源：标题栏画这张 SVG，而任务栏/Alt-Tab 用的是
       `examples/xiangqi/main.cpp` 里 `make_xiangqi_icon_png()` 现画的位图。

       ⚠ **不使用渐变/defs/url(#)**：霜天的 SVG 子集只认实色填充（`defs` 在 flatten
       阶段被跳过、`fill="url(#…)"` 解析不出颜色会回落黑）——用 radialGradient 的
       底色整个失效，图标发黑发糊（实测踩过）。位图那侧的径向渐变（#24201C→#14110E）
       在这里用中点色 #1C1915 逼近，16px 下无可见差异。

       ⚠ **条宽按位图真实几何**（`cx` 是中心不是左缘）：
       左条中心 0.265×24=6.36、半宽 0.058×24=1.39 → x 4.97..7.75（宽 2.78）；
       中条中心 12、半宽 0.064×24=1.54 → x 10.46..13.54（宽 3.07）；
       右条中心 0.735×24=17.64、半宽 1.39 → x 16.25..19.03（宽 2.78）。
       纵向 0.230..0.770 ×24 = y 5.52..18.48。
       早先一版把 cx 当左缘写成 1.4 宽的三根细线——16px 下全是亚像素，
       抗锯齿一抹就是一团糊（用户实测报「标题栏图标糊」的真实根因之一）。
       位图里三根条的 sin 轻弧在 16px 下不可见，这里直接用直条（简单即清晰）。

       要改图形请**同时**改两处（本文件与 make_xiangqi_icon_png）。
       几何约定见 tools/make_brand_svgs.py 的文件头。

       ⚠ **底块必须铺满整数边界 `x=0 y=0 w=24 h=24`**（2026-11-04 实测）。
       早先写的是 `x=0.5 y=0.5 w=23 h=23`（想留 0.5 的呼吸）——在 24px 位图上，
       物理像素 0 只被覆盖 50%，于是边缘 alpha=0.5，深色 `#1C1915` 与浅底
       `#F7F7FA` 混出中灰 `(137,136,136)`。因为深/浅反差极大（28 vs 247），
       这圈 50% 混合的边在视觉上被读成“图标四边多了一圈灰线”（用户实测反馈）。
       铺满整个 viewBox 后边缘 alpha=1，灰线消失；圆角仍在（角上是弧，不是直边）。 -->
  <rect x="0" y="0" width="24" height="24" rx="5.2" fill="#1C1915"/>
  <rect x="4.97" y="5.52" width="2.78" height="12.96" fill="#F26455"/>
  <rect x="10.46" y="5.52" width="3.07" height="12.96" fill="#FFFFFF"/>
  <rect x="16.25" y="5.52" width="2.78" height="12.96" fill="#5AA4E8"/>
</svg>
