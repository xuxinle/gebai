<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- 歌白代码（gbcode）的产品标记 —— 24 视框，矢量源。
       ⚠ 与**歌白智能体**的标记（`gebai-agent-logo.svg`）是两个不同的记号，不要混用：
       那个属于 `gebai` 本体（AI 智能体）。本记号只属于 gbcode 这个代码编辑器产品。

       设计约束（为什么长这样）：
       - **家族语言**：与智能体标记共用「蓝底圆角方 + 左右对称的一对形状」——
         同族产品放在任务栏相邻位置时，一眼看得出是一家；
       - **差异化**：把有机的叶瓣换成一**对几何尖括号**（`< >`）——
         「代码」的通用记号，且是纯直线段构形（小尺寸下最稳的特征，见
         `src/ui/icon.cpp` 关于「小尺寸只能承载少量大特征」的注释）；
       - **单色填充、无描边**：图标会被光栅化到 16×16 交给窗口系统，
         描边在这种尺寸下会与抗锯齿糊成灰边。

       几何：两枚对称的「括号 + 中点」：左 `<`（两段 45° 直线）、右 `>`，
       中间一枚圆点（「光标 / 当前行」）。中点在 8px 下会消失，括号的斜线仍在——
       这是刻意的层级（形状先塌陷，方向感最后塌陷）。 -->
  <path fill="#4D6BFE" d="M6.75 0.5 L17.25 0.5 C20.15 0.5 22.5 2.85 22.5 5.75 L22.5 16.25
    C22.5 19.15 20.15 21.5 17.25 21.5 L6.75 21.5 C3.85 21.5 1.5 19.15 1.5 16.25
    L1.5 5.75 C1.5 2.85 3.85 0.5 6.75 0.5 Z"/>
  <g fill="#FFFFFF">
    <!-- 左尖括号：顶边 → 顶点 → 底边（三段线围成的闭合带，线宽 1.9 竖向） -->
    <path d="M9.05 7.0 L4.75 12.0 L9.05 17.0 L10.65 15.6 L7.35 12.0 L10.65 8.4 Z"/>
    <!-- 右尖括号：与左侧镜像（关于 x = 12） -->
    <path d="M14.95 7.0 L19.25 12.0 L14.95 17.0 L13.35 15.6 L16.65 12.0 L13.35 8.4 Z"/>
    <!-- 中点：光标（直径 2.6，中心 12,12） -->
    <circle cx="12" cy="12" r="1.3"/>
  </g>
</svg>
